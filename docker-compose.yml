# Local infrastructure only: PostgreSQL with pgvector (source of truth AND vector search).
# The FastAPI backend and React frontend run locally outside Docker.
# No secrets live here: the postgres credentials are local-dev defaults matching .env.example.
services:
  postgres:
    image: pgvector/pgvector:pg16   # PostgreSQL 16 + pgvector (embeddings live in document_chunks.embedding)
    container_name: dataroom-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: data_room
    ports:
      # Host port 5442: 5432/5433 are commonly taken by other local Postgres instances.
      - "5442:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d data_room"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
